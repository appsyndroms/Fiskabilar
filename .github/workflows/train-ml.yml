name: Träna och diagnostisera ML-modellen

on:
  schedule:
    # Kör efter dagens fyndkontroller och uppdaterar modellen en gång per dygn.
    - cron: "30 22 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: train-ml
  cancel-in-progress: false

jobs:
  train-and-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Träna ML-modellen
        run: python -u -m ml.train_market_model

      - name: Kör ML-diagnostik
        run: python -u -m ml.analyze_model --debug

      - name: Spara tränad modell och metadata
        id: save-ml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ml/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen förändring av ML-modellen eller fyndfilen att committa."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          git commit -m "Tränar och uppdaterar ML-modellen"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Bygg och publicera hemsidan med nya ML-fynd
        if: steps.save-ml.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ML-resultatet har ändrats."
          echo "Startar ny webbpublicering med senaste fynd.jsonl."

          gh workflow run daily_market_report.yml --ref main
