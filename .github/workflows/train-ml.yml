name: Träna och diagnostisera ML-modellen
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: train-ml
  cancel-in-progress: false
jobs:
  train-and-diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Träna ML-modellen
        run: python -u -m ml.train_market_model
      - name: Kör ML-diagnostik
        run: python -u -m ml.analyze_model --debug
      - name: Spara tränad modell och metadata
        id: save-ml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen förändring av ML-modellen eller fyndfilen att committa."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Tränar och uppdaterar ML-modellen"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
