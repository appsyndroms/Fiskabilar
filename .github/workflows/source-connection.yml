name: Kontrollera källanslutning
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests curl_cffi playwright
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a python -u -m scripts.check_source_connection
