name: DEBUG - Daglig marknadsrapport Fiskabilar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiskabilar-daily-market-report-debug
  cancel-in-progress: false

jobs:
  daily-market-report-debug:

    runs-on: ubuntu-latest

    steps:

      - name: Hämta repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: |
          pip install -r requirements.txt

      - name: Kör debugrapport
        run: |
          echo "=================================================="
          echo "DEBUG: Daglig marknadsrapport"
          echo "=================================================="
          echo "MEJL KOMMER INTE ATT SKICKAS"
          echo "INGEN RAPPORTFIL KOMMER ATT SKAPAS"
          echo "PRODUKTIONSLOGGEN KOMMER INTE ATT ÄNDRAS"
          echo "=================================================="

          python -u -m reporting.daily_market_report_debug
