name: DEBUG - Daglig marknadsrapport Fiskabilar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiskabilar-daily-market-report-debug
  cancel-in-progress: false

jobs:

  daily-market-report-debug:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Hämta repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: |
          pip install -r requirements.txt

      # --------------------------------------------------
      # DEBUG MARKNADSRAPPORT
      # --------------------------------------------------

      - name: Kör debugrapport
        run: |
          echo "=================================================="
          echo "DEBUG: Daglig marknadsrapport"
          echo "=================================================="
          echo "MEJL KOMMER INTE ATT SKICKAS"
          echo "INGEN RAPPORTFIL KOMMER ATT SKAPAS"
          echo "PRODUKTIONSLOGGEN KOMMER INTE ATT ÄNDRAS"
          echo "=================================================="

          python -u -m reporting.daily_market_report_debug

      # --------------------------------------------------
      # ML
      # --------------------------------------------------

      - name: Träna ML-modell
        run: |
          echo "=================================================="
          echo "DEBUG: ML-träning"
          echo "=================================================="
          echo "Modellen tränas på befintlig marknadshistorik."
          echo "Ingen valuation-logik påverkas."
          echo "Ingen produktionsdata ändras."
          echo "=================================================="

          python -u -m ml.train_market_model

      # --------------------------------------------------
      # BYGG STATISK WEBB
      # --------------------------------------------------

      - name: Bygg statisk webb
        run: |
          echo "=================================================="
          echo "DEBUG: Bygger Fiskabilar Analytics"
          echo "=================================================="

          python -u web/build_static.py

      # --------------------------------------------------
      # VALIDERING
      # --------------------------------------------------

      - name: Validera statisk webb
        run: |
          echo "=================================================="
          echo "DEBUG: Validerar web_site"
          echo "=================================================="

          test -f web_site/index.html
          test -f web_site/data.json
          test -f web_site/.nojekyll

          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path("web_site/data.json")

          with data_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          required = {
              "generated_at",
              "summary",
              "current_findings",
              "price_reductions",
              "find_outcomes",
              "score_analysis",
              "market_history",
              "ml",
          }

          missing = required - set(data)

          if missing:
              raise SystemExit(
                  f"Saknade nycklar i data.json: {sorted(missing)}"
              )

          html = Path(
              "web_site/index.html"
          ).read_text(
              encoding="utf-8"
          )

          if "<html" not in html:
              raise SystemExit(
                  "index.html verkar inte vara en HTML-fil."
              )

          print("==================================================")
          print("DEBUG: Webbplatsen är korrekt byggd.")
          print(
              f"Aktuella fynd: "
              f"{len(data['current_findings'])}"
          )
          print(
              f"Fynd-event: "
              f"{len(data['find_outcomes'])}"
          )
          print(
              f"Prissänkningar: "
              f"{len(data['price_reductions'])}"
          )
          print(
              f"Marknadsobservationer: "
              f"{len(data['market_history'])}"
          )
          print("==================================================")
          PY

      # --------------------------------------------------
      # DEBUG ARTIFACT
      # --------------------------------------------------

      - name: Ladda upp debug-webb som artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiskabilar-web-debug
          path: web_site
          if-no-files-found: error
