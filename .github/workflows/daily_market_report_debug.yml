name: DEBUG - Daglig marknadsrapport Fiskabilar

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fiskabilar-daily-market-report-debug
  cancel-in-progress: false

jobs:

  build:
    name: Bygg debugrapport och webb
    runs-on: ubuntu-latest

    steps:

      - name: Hämta repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: |
          pip install -r requirements.txt

      - name: Kör debugrapport
        run: |
          echo "=================================================="
          echo "DEBUG: Daglig marknadsrapport"
          echo "=================================================="
          echo "MEJL KOMMER INTE ATT SKICKAS"
          echo "INGEN RAPPORTFIL KOMMER ATT SKAPAS"
          echo "PRODUKTIONSLOGGEN KOMMER INTE ATT ÄNDRAS"
          echo "=================================================="

          python -u -m reporting.daily_market_report_debug

      - name: Träna ML-modell
        run: |
          echo "=================================================="
          echo "DEBUG: ML-träning"
          echo "=================================================="
          echo "Modellen tränas på befintlig marknadshistorik."
          echo "Ingen valuation-logik påverkas."
          echo "Ingen produktionsdata ändras."
          echo "=================================================="

          python -u -m ml.train_market_model

      - name: Bygg statisk webb
        run: |
          python -u web/build_static.py

      - name: Validera statisk webb
        run: |
          test -f web_site/index.html
          test -f web_site/data.json
          test -f web_site/.nojekyll

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("web_site/data.json").read_text(encoding="utf-8")
          )

          required = {
              "generated_at",
              "summary",
              "current_findings",
              "price_reductions",
              "find_outcomes",
              "score_analysis",
              "market_history",
              "ml",
          }

          missing = required - set(data)

          if missing:
              raise SystemExit(
                  f"Saknade nycklar i data.json: {sorted(missing)}"
              )

          html = Path("web_site/index.html").read_text(
              encoding="utf-8"
          )

          if "<html" not in html.lower():
              raise SystemExit(
                  "index.html verkar inte vara en HTML-fil"
              )

          print("Webbvalidering OK")
          print(f"Fynd: {len(data['current_findings'])}")
          print(f"Prisändringar: {len(data['price_reductions'])}")
          print(f"Fyndutfall: {len(data['find_outcomes'])}")
          print(f"Marknadshistorik: {len(data['market_history'])}")
          PY

      - name: Spara webb som artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiskabilar-web-debug
          path: web_site

      - name: Skapa Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_site


  deploy:
    name: Publicera debugwebb
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicera GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Skriv ut webb-URL
        run: |
          echo "=========================================="
          echo "FISKABILAR WEBB"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "=========================================="
