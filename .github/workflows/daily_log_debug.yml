name: DEBUG - Fyndkontroll för bilar (var 15:e minut, 06-22 svensk tid)

on:
  schedule:
    - cron: "*/15 4-21 * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fyndkontroll-main
  cancel-in-progress: false

jobs:
  kontrollera-fynd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör fyndfilter
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
        run: python -u main.py --log-level DEBUG

      - name: Spara historik och state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Uppdaterar fyndhistorik"
          file_pattern: "data/state.json data/market_history.jsonl"
          branch: main
