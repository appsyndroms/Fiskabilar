name: DEBUG - Fyndkontroll för bilar

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fyndkontroll-debug
  cancel-in-progress: true

jobs:
  kontrollera-fynd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör fyndfilter
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
          DEBUG: "true"
        run: python -u main.py --log-level DEBUG

      - name: Kontrollera dagens historikpriser
        run: python -u scripts/verifiera_dagens_historik.py

      - name: Analysera faktiska fyndutfall
        run: python -u scripts/analysera_fyndutfall.py
