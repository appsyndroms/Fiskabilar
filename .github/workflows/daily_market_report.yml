name: Daglig marknadsrapport Fiskabilar

on:
  schedule:
    - cron: "0 21 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      force_email:
        description: "Skicka mejlet även om dagens rapport redan skickats"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fiskabilar-data-write
  cancel-in-progress: false

jobs:
  daily-market-report:

    runs-on: ubuntu-latest

    steps:

      - name: Hämta repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Skapa daglig marknadsrapport
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
        run: |
          if [ "${{ inputs.force_email }}" = "true" ]; then
            python -u -m reporting.daily_market_report --force-email
          else
            python -u -m reporting.daily_market_report
          fi

      - name: Träna ML-modell
        run: python -u -m ml.train_market_model

      - name: Bygg statisk webb
        run: python -u web/build_static.py

      - name: Validera statisk webb
        run: |
          test -f web_site/index.html
          test -f web_site/data.json
          test -f web_site/.nojekyll

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("web_site/data.json").read_text(encoding="utf-8")
          )

          required = {
              "generated_at",
              "summary",
              "current_findings",
              "price_reductions",
              "find_outcomes",
              "score_analysis",
              "market_history",
              "ml",
          }

          missing = required - set(data)

          if missing:
              raise SystemExit(
                  f"Saknade nycklar i data.json: {sorted(missing)}"
              )

          html = Path("web_site/index.html").read_text(
              encoding="utf-8"
          )

          if "<html" not in html.lower():
              raise SystemExit(
                  "index.html verkar inte vara en HTML-fil"
              )

          print("Webbvalidering OK")
          print(f"Fynd: {len(data['current_findings'])}")
          print(f"Prisändringar: {len(data['price_reductions'])}")
          print(f"Fyndutfall: {len(data['find_outcomes'])}")
          print(f"Marknadshistorik: {len(data['market_history'])}")
          PY

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Skapa Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_site

      - name: Publicera GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Skriv ut webb-URL
        run: |
          echo "=========================================="
          echo "FISKABILAR WEBB"
          echo "https://appsyndroms.github.io/Fiskabilar/"
          echo "=========================================="

      - name: Spara rapportlogg och ML-modell
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/daily_reports data/ml

          if git diff --cached --quiet; then
            echo "Ingen förändring i rapportloggen eller ML-modellen."
            exit 0
          fi

          git commit -m "Uppdaterar daglig rapport och ML-modell"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
