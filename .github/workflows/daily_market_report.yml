name: Daglig marknadsrapport Fiskabilar

on:
  schedule:
    - cron: "0 22 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      force_email:
        description: "Skicka mejlet även om dagens rapport redan skickats"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fiskabilar-data-write
  cancel-in-progress: false

jobs:
  daily-market-report:

    runs-on: ubuntu-latest

    steps:

      - name: Hämta repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Skapa daglig marknadsrapport
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
        run: |
          if [ "${{ inputs.force_email }}" = "true" ]; then
            python -u -m reporting.daily_market_report --force-email
          else
            python -u -m reporting.daily_market_report
          fi

      - name: Spara rapportlogg
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/daily_reports

          if git diff --cached --quiet; then
            echo "Ingen förändring i rapportloggen."
            exit 0
          fi

          git commit -m "Sparar daglig marknadsrapport"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
