name: Daglig marknadsrapport Fiskabilar
on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Skicka mejlet även om dagens rapport redan skickats"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: Bygg daglig rapport och webb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Installera beroenden
        run: pip install -r requirements.txt
      - name: Träna ML-modell
        run: |
          python -u -m ml.train_market_model
      - name: Uppdatera ML-fynd
        run: |
          python -u -m ml.analyze_model --debug
      - name: Generera ML-värderingar
        run: |
          python -u -m ml.generate_ml_valuation
      # Övriga befintliga steg i workflowet fortsätter här:
      # datainsamling, rapportgenerering, webbbygge och publicering.
