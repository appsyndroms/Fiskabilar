name: Fiskabilar fyndkontroll var 15:e minut

on:
  schedule:
    - cron: '*/15 6-21 * * *'
      timezone: Europe/Stockholm
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fiskabilar-data-write
  cancel-in-progress: false

jobs:
  kontrollera-fynd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Stockholm
      FISKABILAR_ONLY_DAILY_REPORT: "0"
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: python -m pip install -r requirements.txt

      - name: Hämta annonser och mejla nya fynd
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
        run: |
          python -c 'import os; assert os.environ.get("EPOST_LOSENORD", "").strip(), "GitHub-hemligheten EPOST_LOSENORD saknas; fyndmejl kan inte skickas."'
          python -u main.py

      - name: Uppdatera fyndutfall
        run: python -u scripts/analysera_fyndutfall.py

      # Spara notifieringsstatus före ML så att träningsfel inte orsakar
      # upprepade mejl om samma fynd i nästa körning.
      - name: Spara historik, state och skickade fyndnotiser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen dataförändring att spara."
            exit 0
          fi
          git commit -m "Uppdaterar fyndhistorik och notifieringsstatus"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Träna ML-modellen
        run: python -u -m ml.train_market_model

      - name: Uppdatera ML-värderingar
        run: python -u -m ml.generate_ml_valuation

      - name: Spara modell och värderingar
        run: |
          git add data/ml/ data/ml_valuation.jsonl
          if git diff --cached --quiet; then
            echo "Ingen modellförändring att spara."
            exit 0
          fi
          git commit -m "Uppdaterar ML efter fyndkontroll"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
