name: Fyndkontroll för bilar (var 30:e minut, 06-22 svensk tid)

on:
  # Kör var 30:e minut, 04:00-21:59 UTC. Det här fönstret är medvetet
  # bredare än 06:00-22:00 svensk tid för att täcka BÅDE sommartid
  # (CEST, UTC+2) och vintertid (CET, UTC+1) utan att cron-schemat
  # behöver ändras manuellt två gånger om året. main.py avgör sedan
  # (mot Europe/Stockholm) om det faktiskt är 06:00-22:00 lokal tid
  # och avslutar tyst annars - så du får ingen spam nattetid.
  schedule:
    - cron: "*/15 4-21 * * *"
  workflow_dispatch: {}  # gör så du kan trigga manuellt från GitHub-appen

permissions:
  contents: write  # krävs för att git-auto-commit-action ska kunna pusha tillbaka state.json

jobs:
  kontrollera-fynd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör fyndfilter
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
        run: python -u main.py

      - name: Spara historik (state.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Uppdaterar fyndhistorik"
          file_pattern: "data/state.json"
