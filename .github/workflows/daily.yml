name: Fyndkontroll för bilar (var 15:e minut, 06-22 svensk tid)

on:
  schedule:
    - cron: "*/15 6-21 * * *"
      timezone: "Europe/Stockholm"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fyndkontroll-main
  cancel-in-progress: false

jobs:
  kontrollera-fynd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör fyndfilter
        env:
          EPOST_LOSENORD: ${{ secrets.EPOST_LOSENORD }}
        run: python -u main.py

      - name: Analysera faktiska fyndutfall
        run: python -u scripts/analysera_fyndutfall.py

      - name: Spara historik, identity, state och fyndutfall
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json data/market_history data/find_feedback/find_outcomes_*.jsonl

          if git diff --cached --quiet; then
            echo "Ingen förändring att committa."
            exit 0
          fi

          git commit -m "Uppdaterar fyndhistorik, identity, state och fyndutfall"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
