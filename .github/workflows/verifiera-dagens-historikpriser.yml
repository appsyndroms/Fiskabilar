name: Verifiera dagens historikpriser

on:
  workflow_dispatch:

jobs:
  verifiera:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kör pipeline
        run: |
          python -u main.py --log-level DEBUG

      - name: Kontrollera dagens historikpriser
        run: |
          python -u scripts/verifiera_dagens_historik.py
